<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetroQuest - Poznej pražské metro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>MetroQuest</h1>
        <p>Poznej pražské metro</p>
    </header>

    <main>
        <section id="uvod">
            <h2>Jak dobře znáš pražské metro?</h2>
            <p>
                Odpovídej na otázky o pražském metru
                a získej co nejvíce bodů!
            </p>

            <ul>
                <li>Každá otázka má čtyři možnosti.</li>
                <li>Za správnou odpověď získáš 10 bodů.</li>
                <li>Za chybnou odpověď získáš 0 bodů.</li>
            </ul>

            <button id="start" type="button">Spustit hru</button>
        </section>

        <section id="hra" hidden>
            <p id="cislo-otazky"></p>
            <h2 id="otazka"></h2>

            <div id="odpovedi"></div>

            <div id="vysledek" aria-live="polite"></div>

            <button id="dalsi" type="button" hidden>
                Další otázka
            </button>
        </section>

        <section id="konec" hidden>
            <h2>Konec hry!</h2>
            <p id="skore"></p>
        </section>
    </main>

    <footer>
        <p>Školní projekt – MetroQuest</p>
    </footer>

</body>
</html>
